<svg font-family="-apple-system-body, ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Helvetica, &quot;Apple Color Emoji&quot;, Arial, sans-serif, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;" font-weight="400" data-d-component="svg" fill="currentColor" style="color:rgb(13, 13, 13)" viewBox="0 0 340 300" width="100%" xmlns="http://www.w3.org/2000/svg"><rect x="35" y="10" width="270" height="45" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="170" y="27" font-size="12" font-weight="600" fill="#172554" text-anchor="middle">1. Datos observados</text><text x="170" y="43" font-size="10" fill="#475569" text-anchor="middle">Dₙ = {(xᵢ, yᵢ)}</text><path d="M170 55 V68" stroke="#64748b" stroke-width="1.6" fill="none"/><path d="M166 63 L170 68 L174 63" stroke="#64748b" stroke-width="1.6" fill="none"/><rect x="35" y="68" width="270" height="45" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="170" y="85" font-size="12" font-weight="600" fill="#172554" text-anchor="middle">2. Ajustar proceso gaussiano</text><text x="170" y="101" font-size="10" fill="#475569" text-anchor="middle">μₙ(x), sₙ(x)</text><path d="M170 113 V126" stroke="#64748b" stroke-width="1.6" fill="none"/><path d="M166 121 L170 126 L174 121" stroke="#64748b" stroke-width="1.6" fill="none"/><rect x="35" y="126" width="270" height="45" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="170" y="143" font-size="12" font-weight="600" fill="#172554" text-anchor="middle">3. Calcular adquisición</text><text x="170" y="159" font-size="10" fill="#475569" text-anchor="middle">EI(x) o LCB(x)</text><path d="M170 171 V184" stroke="#64748b" stroke-width="1.6" fill="none"/><path d="M166 179 L170 184 L174 179" stroke="#64748b" stroke-width="1.6" fill="none"/><rect x="35" y="184" width="270" height="45" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="170" y="201" font-size="12" font-weight="600" fill="#172554" text-anchor="middle">4. Elegir siguiente punto</text><text x="170" y="217" font-size="10" fill="#475569" text-anchor="middle">Maximizar EI o minimizar LCB</text><path d="M170 229 V242" stroke="#64748b" stroke-width="1.6" fill="none"/><path d="M166 237 L170 242 L174 237" stroke="#64748b" stroke-width="1.6" fill="none"/><rect x="35" y="242" width="270" height="45" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="170" y="259" font-size="12" font-weight="600" fill="#172554" text-anchor="middle">5. Ejecutar experimento</text><text x="170" y="275" font-size="10" fill="#475569" text-anchor="middle">Observar yₙ₊₁ = f(xₙ₊₁)</text><path d="M35 265 H14 V32 H35" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/><path d="M29 28 L35 32 L29 36" stroke="#64748b" stroke-width="1.5" fill="none"/></svg>