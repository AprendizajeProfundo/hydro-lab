[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydro-lab-g2"
version = "0.1.0"
description = "Synthetic hydrocarbon transportation network for scientific AI education"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "gymnasium>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ppo = ["stable-baselines3>=2.3,<3", "torch>=2.2,<3"]
ui = ["streamlit>=1.35,<2", "plotly>=5.20,<7", "pandas>=2.2,<3"]

course = [
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
